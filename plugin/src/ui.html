<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<style>
  body { font: 12px/1.4 Inter, system-ui, sans-serif; margin: 12px; color: var(--figma-color-text, #222); background: var(--figma-color-bg, #fff); }
  h1 { font-size: 13px; margin: 0 0 4px; }
  p { margin: 0 0 8px; color: var(--figma-color-text-secondary, #666); }
  textarea { width: 100%; box-sizing: border-box; height: 180px; font: 11px/1.3 ui-monospace, monospace; }
  .row { display: flex; gap: 8px; margin: 8px 0; align-items: center; }
  button { padding: 6px 12px; }
  #status { white-space: pre-wrap; margin-top: 8px; }
  #status.error { color: #b00020; }
  ul { margin: 4px 0 0 16px; padding: 0; }
</style>
</head>
<body>
<h1>website-to-figma (development plugin)</h1>
<p>Import a site map JSON produced by the website-to-figma CLI: schemaVersion 1 (low-fidelity wireframes) or 2 (measured hi-fi with embedded, hash-checked images). Everything is validated before anything is created. Not a pixel-perfect copy.</p>
<div class="row"><input id="file" type="file" accept=".json,application/json"></div>
<textarea id="json" placeholder="...or paste site map JSON here" spellcheck="false"></textarea>
<div class="row"><button id="import">Import</button><button id="close">Close</button></div>
<div id="status"></div>
<ul id="details"></ul>
<script>
  // Plain inline script. Content is only ever written via textContent; no HTML
  // from the JSON or the plugin is interpreted.
  var MAX_BYTES = 72000000; // v2 hi-fi bound; the sandbox re-checks v1 (1 MB) and v2 limits
  var statusEl = document.getElementById("status");
  var detailsEl = document.getElementById("details");
  var jsonEl = document.getElementById("json");

  function show(kind, text, details) {
    statusEl.className = kind === "error" ? "error" : "";
    statusEl.textContent = text;
    while (detailsEl.firstChild) detailsEl.removeChild(detailsEl.firstChild);
    (details || []).slice(0, 12).forEach(function (d) {
      var li = document.createElement("li");
      li.textContent = String(d).slice(0, 300);
      detailsEl.appendChild(li);
    });
  }

  document.getElementById("file").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    if (f.size > MAX_BYTES) { show("error", "File is larger than " + MAX_BYTES + " bytes."); return; }
    f.text().then(function (t) { jsonEl.value = t; show("status", "Loaded " + f.name + ". Press Import."); },
                  function () { show("error", "Could not read the file."); });
  });

  document.getElementById("import").addEventListener("click", function () {
    var json = jsonEl.value;
    if (!json.trim()) { show("error", "Choose a file or paste JSON first."); return; }
    if (new Blob([json]).size > MAX_BYTES) { show("error", "JSON is larger than " + MAX_BYTES + " bytes."); return; }
    show("status", "Validating...");
    parent.postMessage({ pluginMessage: { type: "import", json: json } }, "*");
  });

  document.getElementById("close").addEventListener("click", function () {
    parent.postMessage({ pluginMessage: { type: "close" } }, "*");
  });

  window.onmessage = function (event) {
    var m = event.data && event.data.pluginMessage;
    if (!m || typeof m !== "object") return;
    if (["status", "error", "done"].indexOf(m.type) === -1 || typeof m.text !== "string") return;
    var details = Array.isArray(m.details) ? m.details.filter(function (d) { return typeof d === "string"; }) : [];
    show(m.type, m.text.slice(0, 500), details);
  };
</script>
</body>
</html>
